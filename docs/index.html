<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><script src="https://telegram.org/js/telegram-web-app.js"></script><title>PokerFace</title><style>*{box-sizing:border-box}body{margin:0;background:#07110d;color:#fff;font-family:system-ui}main{max-width:680px;margin:auto;padding:10px}.top{display:flex;justify-content:space-between}.table{background:#116b45;border:7px solid #202020;border-radius:42px;padding:18px;min-height:430px}.pot{text-align:center;font-size:21px;font-weight:700}.board,.hole{display:flex;justify-content:center;gap:7px;margin:18px 0}.card{width:48px;height:68px;background:#fff;color:#111;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:700}.players{display:grid;grid-template-columns:1fr 1fr;gap:7px}.seat{background:#08271b;border-radius:10px;padding:9px;border:1px solid #ffffff22}.turn{outline:2px solid #ffd43b}.me{border:2px solid #fff}.muted{opacity:.7;font-size:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.actions button,.betrow button{border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:700}.fold{background:#9f3030;color:#fff}.betrow{display:flex;gap:8px;margin-top:8px}.betrow input{flex:1;padding:12px;border-radius:9px;border:0}.msg{background:#13251e;border-radius:10px;padding:11px;margin-top:9px}.hidden{display:none}.winbox{background:linear-gradient(135deg,#3a2f0a,#1f1a08);border:1px solid #ffd43b55;border-radius:10px;padding:11px;margin-bottom:10px;text-align:center}.winbox b{color:#ffd43b}.wincards{display:flex;justify-content:center;gap:5px;margin-top:6px}.wincards .card{width:36px;height:50px;font-size:18px}</style></head><body><main><div class="top"><h2>♠ PokerFace</h2><span id="stage"></span></div><div id="root">Conectando…</div></main><script>
const API_URL = "https://pumviyzvhtxaqitfttub.supabase.co/functions/v1/pokerface-app";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1bXZpeXp2aHR4YXFpdGZ0dHViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNTM2MzYsImV4cCI6MjEwNDcyOTYzNn0.njK5eRpV9BX4jSY7BF7ByycrJ0cgmABPe7C-S66epEI";
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const game=new URLSearchParams(location.search).get('game');
async function api(path,body){const r=await fetch(API_URL,{method:'POST',headers:{'content-type':'application/json','apikey':ANON_KEY,'x-telegram-init-data':tg.initData},body:JSON.stringify({path,game,...body})});return r.json()}
async function action(a){const amount=(a==='bet'||a==='raise')?Number(document.querySelector('#amount').value||0):0;const d=await api('action',{action:a,amount});if(d.error)show('<b>'+d.error+'</b>');else load()}
function show(x){document.querySelector('#root').innerHTML=x}
function seatLabel(seat,players){const p=(players||[]).find(x=>x.seat===seat);return p?p.username:('Asiento '+seat)}
function winBanner(g){const lr=g.last_result;if(!lr)return '';
  if(lr.reason==='fold'){const who=seatLabel(lr.winners[0],g.__players);return '<div class="winbox">🏆 <b>'+who+'</b> ganó '+lr.pot+' 🪙 · los demás jugadores se retiraron</div>'}
  const who=lr.winners.map(s=>seatLabel(s,g.__players)).join(' y ');
  const cards=(lr.winning_cards||[]).map(c=>'<div class="card">'+c+'</div>').join('');
  return '<div class="winbox">🏆 <b>'+who+'</b> ganó '+lr.pot+' 🪙 con <b>'+lr.hand_name+'</b><div class="wincards">'+cards+'</div></div>'
}
function render(d){const g=d.game,me=d.me;g.__players=d.players;document.querySelector('#stage').textContent=g.stage.toUpperCase();const board=(g.community_cards||[]).map(c=>'<div class="card">'+c+'</div>').join('');const ps=(d.players||[]).map(p=>'<div class="seat '+(p.seat===me.seat_number?'me ':'')+(p.seat===g.current_seat?'turn':'')+'">🪑 '+p.seat+' · '+p.username+'<br><b>'+p.chips+' 🪙</b>'+(p.folded?' · FOLD':p.all_in?' · ALL-IN':'')+(p.cards?'<br>'+p.cards.join(' '):'')+'</div>').join('');const myTurn=me.seat_number===g.current_seat;const call=Math.max(0,g.current_bet-(d.hand?.round_contributed||0));const bet=g.current_bet===0;show(winBanner(g)+'<div class="table"><div class="pot">Bote '+g.pot+' 🪙</div><div class="board">'+board+'</div><div class="players">'+ps+'</div><div class="hole">'+(d.hand?[d.hand.card_1,d.hand.card_2].map(c=>'<div class="card">'+c+'</div>').join(''):'')+'</div></div><div class="msg">'+(myTurn?'<b>Tu turno</b> · '+(call?'A pagar: '+call:'Puedes pasar'):'Turno del asiento '+(g.current_seat??'—'))+'</div><div class="actions '+(myTurn?'':'hidden')+'"><button class="fold" onclick="action(\'fold\')">FOLD</button><button onclick="action(\'check\')">CHECK</button><button onclick="action(\'call\')">CALL</button><button onclick="action(\'all_in\')">ALL-IN</button></div><div class="betrow '+(myTurn?'':'hidden')+'"><input id="amount" type="number" min="20" step="10" placeholder="Cantidad"><button onclick="action(\''+(bet?'bet':'raise')+'\')">'+(bet?'BET':'RAISE')+'</button></div><div class="msg">Ciegas '+g.small_blind+'/'+g.big_blind+' · Turno '+(g.current_seat??'—')+'</div>')}
async function load(){if(!tg?.initData){show('<b>Abre la partida desde Telegram.</b>');return}const d=await api('state',{});if(d.error)show('<b>'+d.error+'</b>');else render(d)}
load();setInterval(load,1500);
</script></body></html>
